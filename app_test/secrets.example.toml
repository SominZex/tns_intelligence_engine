# Databricks
DATABRICKS_HOST = "https://<workspace>.cloud.databricks.com"
DATABRICKS_CLIENT_ID = "<oauth-client-id>"
DATABRICKS_CLIENT_SECRET = "<oauth-client-secret>"
GENIE_SPACE_ID = "<genie-space-id>"

# Simple Streamlit login
APP_USERNAME = "admin"
APP_PASSWORD = "change-me"

# PostgreSQL - keeps chat history persistent across Streamlit sessions
POSTGRES_HOST = "<postgres-host>"
POSTGRES_PORT = 5432
POSTGRES_DATABASE = "<database>"
POSTGRES_USER = "<user>"
POSTGRES_PASSWORD = "<password>"
POSTGRES_SCHEMA = "genie_app"

# Optional Genie reliability settings
GENIE_POLL_INTERVAL_SECONDS = 1.0
GENIE_TIMEOUT_SECONDS = 1800
GENIE_STREAM_RETRIES = 2
GENIE_TCP_KEEPALIVE = true
